<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p.a.tysonmediagroup.org &bull; Redirecting to power.administration.tysonmediagroup.org</title>
  <meta http-equiv="refresh" content="0; url=https://power.administration.tysonmediagroup.org/">
  <link rel="canonical" href="https://power.administration.tysonmediagroup.org/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000000;
      color: #e5e7eb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 90% 45% at 50% -10%, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 45%, #000000 85%),
        linear-gradient(180deg, #050507 0%, #000000 100%);
    }
    .brand-tmg-domain {
      font-family: 'Cormorant Garamond', Georgia, serif !important;
      font-style: italic !important;
      font-weight: 500 !important;
      letter-spacing: 0.02em !important;
    }
    .redirect-card {
      background: linear-gradient(180deg, rgba(24, 24, 30, 0.95) 0%, rgba(10, 10, 14, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.92), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    .redirect-badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(220, 38, 38, 0.5);
      background: rgba(220, 38, 38, 0.15);
      color: #fca5a5;
      margin-bottom: 18px;
    }
    .redirect-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .redirect-sub {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .redirect-link {
      display: inline-block;
      background: linear-gradient(180deg, #2a2a32 0%, #15151b 50%, #0a0a0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 22px;
      text-decoration: none;
      font-size: 1.15rem;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .redirect-link:hover {
      border-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
  </style>
  <script>
    (function () {
      var dest = 'https://power.administration.tysonmediagroup.org' + window.location.pathname + window.location.search + window.location.hash;
      try {
        window.location.replace(dest);
      } catch (e) {
        window.location.href = dest;
      }
    })();
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-badge">TYSON Administration Router</div>
    <h1 class="redirect-title">Forwarding to Secure Console</h1>
    <p class="redirect-sub">
      Domain <span class="brand-tmg-domain">p.a.tysonmediagroup.org</span> routes directly to the primary administrative node.
    </p>
    <a href="https://power.administration.tysonmediagroup.org" class="redirect-link brand-tmg-domain" id="manualRedirect">
      power.administration.tysonmediagroup.org &rarr;
    </a>
  </div>
  <script>
    var dest = 'https://power.administration.tysonmediagroup.org' + window.location.pathname + window.location.search + window.location.hash;
    var el = document.getElementById('manualRedirect');
    if (el) el.href = dest;
  </script>
</body>
</html>
